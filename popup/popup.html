<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps Lead Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span class="logo-icon">🗺️</span>
      <h1 class="title">Maps Lead Extractor</h1>
    </div>
    <span id="statusBadge" class="badge idle">IDLE</span>
  </header>

  <!-- Metrics Status -->
  <section class="metrics-card">
    <div class="metrics-row">
      <span class="metric-label">Total Leads Terkumpul:</span>
      <span id="leadCount" class="metric-value">0</span>
    </div>
    <div id="statusText" class="status-text">Siap mengekstrak data dari Google Maps.</div>
  </section>

  <!-- Action Controls -->
  <section class="controls">
    <div class="btn-row">
      <button id="btnStart" class="btn-primary">
        <span>▶</span> Start Scraping
      </button>
      <button id="btnPause" class="btn-warning" style="display: none;">
        <span>⏸</span> Pause
      </button>
      <button id="btnResume" class="btn-primary" style="display: none;">
        <span>▶</span> Lanjut
      </button>
      <button id="btnStop" class="btn-danger" disabled>
        <span>⏹</span> Stop
      </button>
    </div>
    <div class="btn-row">
      <button id="btnClear" class="btn-outline">
        <span>🗑</span> Hapus Data
      </button>
    </div>
  </section>

  <!-- Preview Table -->
  <section class="preview-section">
    <span class="section-title">Pratinjau Data (5 Terbaru)</span>
    <div class="table-wrapper">
      <table id="previewTable">
        <thead>
          <tr>
            <th>Nama</th>
            <th>Kategori</th>
            <th>Telepon</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody id="previewBody">
          <!-- Diisi via popup.js -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state">
        Belum ada data. Buka Google Maps, cari tempat, lalu klik Start.
      </div>
    </div>
  </section>

  <!-- Export Actions -->
  <section class="controls">
    <div class="btn-row">
      <button id="btnExportCSV" class="btn-export-csv" disabled>
        <span>📥</span> Unduh CSV (Excel)
      </button>
      <button id="btnExportJSON" class="btn-export-json" disabled>
        <span>📄</span> Unduh JSON
      </button>
    </div>
  </section>

  <footer class="footer-note">
    100% In-Page Scraping · Aman & Lokal di Browser Anda
  </footer>

  <script src="../scripts/exporter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
