<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps Lead Extractor</title>
  <link rel="icon" type="image/png" href="../icons/icon16.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <img src="../icons/icon48.png" alt="Maps Lead Extractor" class="logo-img" width="22" height="22">
      <h1 class="title">Maps Lead Extractor</h1>
    </div>
    <span id="statusBadge" class="badge idle">IDLE</span>
  </header>

  <!-- Metrics Status -->
  <section class="metrics-card">
    <div class="metrics-row">
      <span class="metric-label">Total Leads Terkumpul:</span>
      <span id="leadCount" class="metric-value">0</span>
    </div>
    <div id="statusText" class="status-text" role="status" aria-live="polite">Siap mengekstrak data dari Google Maps.</div>
    <button id="btnReloadTab" class="btn-outline btn-sm" style="display: none;" type="button">
      🔄 Muat Ulang Tab Google Maps
    </button>
  </section>

  <!-- Filter & Target Settings -->
  <section class="settings-card" aria-label="Pengaturan Scraping">
    <div class="settings-row">
      <label for="inputMaxLeads" class="settings-label">Batas Maksimal Leads</label>
      <input type="number" id="inputMaxLeads" class="input-number" min="0" max="5000" placeholder="Tanpa batas">
    </div>
    <div class="filter-row">
      <label class="filter-chip">
        <input type="checkbox" id="chkOnlyPhone">
        <span>Wajib Ada Telepon</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" id="chkOnlyWebsite">
        <span>Wajib Ada Website</span>
      </label>
    </div>
  </section>

  <!-- Action Controls -->
  <section class="controls">
    <div class="btn-row">
      <button id="btnStart" class="btn-primary">
        <span>▶</span> Start Scraping
      </button>
      <button id="btnPause" class="btn-warning" style="display: none;">
        <span>⏸</span> Pause
      </button>
      <button id="btnResume" class="btn-primary" style="display: none;">
        <span>▶</span> Lanjut
      </button>
      <button id="btnStop" class="btn-danger" disabled>
        <span>⏹</span> Stop
      </button>
    </div>
    <div class="btn-row">
      <button id="btnClear" class="btn-outline" type="button">
        <span>🗑</span> Hapus Data
      </button>
    </div>
    <div id="clearConfirmBar" class="inline-confirm" style="display: none;" role="alertdialog" aria-label="Konfirmasi hapus data">
      <span class="inline-confirm-text">Hapus semua data tersimpan?</span>
      <div class="inline-confirm-actions">
        <button id="btnConfirmClear" class="btn-danger btn-sm" type="button">Ya, Hapus</button>
        <button id="btnCancelClear" class="btn-outline btn-sm" type="button">Batal</button>
      </div>
    </div>
  </section>

  <!-- Preview Table -->
  <section class="preview-section">
    <div class="preview-header">
      <span id="previewTitle" class="section-title">Pratinjau Data</span>
      <input type="search" id="searchPreview" class="input-search" placeholder="Cari nama / telepon..." aria-label="Cari data pratinjau">
    </div>
    <div class="table-wrapper">
      <table id="previewTable">
        <thead>
          <tr>
            <th>Nama</th>
            <th>Kategori</th>
            <th>Telepon</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody id="previewBody">
          <!-- Diisi via popup.js -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state">
        Belum ada data. Buka Google Maps, cari tempat, lalu klik Start.
      </div>
    </div>
  </section>

  <!-- Export Actions -->
  <section class="controls">
    <div class="btn-row">
      <button id="btnExportCSV" class="btn-export-csv" disabled>
        <span>📥</span> Unduh CSV (Excel)
      </button>
      <button id="btnExportJSON" class="btn-export-json" disabled>
        <span>📄</span> Unduh JSON
      </button>
    </div>
  </section>

  <footer class="footer-note">
    100% In-Page Scraping · Aman & Lokal di Browser Anda
  </footer>

  <script src="../scripts/exporter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
